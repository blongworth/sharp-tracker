[project]
name = "sharp-tracker"
version = "0.1.0"
description = "Listen to NMEA position data, log fixes, and display a live MapLibre tracker map."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "psycopg[binary]>=3.2",
    "pydantic>=1.10",
    "pynmea2>=1.19",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sharp-tracker = "sharp_tracker.run:main"
sharp-tracker-collector = "sharp_tracker.collector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "circup>=3.2.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
