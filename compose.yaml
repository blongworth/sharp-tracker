# Local infrastructure for development and tests. The Python app itself runs
# with `uv run` (the ship collector needs USB serial, which Docker Desktop on
# macOS can't pass through).
#
#   docker compose up -d postgres
#   DATABASE_URL=postgresql://sharp:sharp@127.0.0.1:5432/sharp_tracker uv run sharp-tracker-live
#   TEST_DATABASE_URL=postgresql://sharp:sharp@127.0.0.1:5432/sharp_tracker_test uv run pytest
#
# Credentials are throwaway and local-only; never reuse them on Railway.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sharp
      POSTGRES_PASSWORD: sharp
      POSTGRES_DB: sharp_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharp -d sharp_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
